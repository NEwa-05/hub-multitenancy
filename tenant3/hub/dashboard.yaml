---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hub-dashboard
  namespace: tenant3
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`hub.tenant3.${CLUSTERNAME}.${DOMAINNAME}`)
      services:
        - name: api@internal
          kind: TraefikService
  tls: {}